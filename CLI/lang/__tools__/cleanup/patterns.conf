# CLI Translation Key Usage Patterns
# One extended regex per line, comment with '#'
# Order from most specific to most general
# Group 1 or 2 should capture the translation key

# Function definitions (most common pattern)
\bquickbox::lang::([a-zA-Z0-9_:]+)\s*\(\)

# Function existence checks with declare -F
\bdeclare\s+-F\s+quickbox::lang::([a-zA-Z0-9_:]+)

# Function calls (with or without parentheses)
quickbox::lang::([a-zA-Z0-9_:]+)

# Legacy function patterns (if any exist)
\b(mflang|get_lang|qb_lang|print_lang|qb::lang)\s*\(\s*['"]([A-Z0-9_:\-]+)['"]
\b(mflang|get_lang|qb_lang|print_lang|qb::lang)\s+['"]([A-Z0-9_:\-]+)['"]

# Legacy function calls with unquoted keys (capture group 1)
\b(mflang|get_lang|qb_lang|print_lang|qb::lang)\s*\(\s*([A-Z0-9_:\-]+)\s*\)

# PHP direct lookups (guarded to CLI contexts)
\$L\[['\"]([A-Z0-9_:\-]+)['\"]\]

# Generic uppercase key reference (fallback - must be gated by prefix allowlist)
\b([A-Z][A-Z0-9_]{2,})\b
